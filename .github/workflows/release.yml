# On a v* tag: multi-arch images to ghcr.io/thesupersupersigma/reconsumet-{api,relay}:<version> and :latest.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, relay]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3 # arm64 is built under emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/thesupersupersigma/reconsumet-${{ matrix.target }}:${{ steps.v.outputs.version }}
            ghcr.io/thesupersupersigma/reconsumet-${{ matrix.target }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
