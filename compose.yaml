# Local/dev stack: Postgres 17 + API + relay. `cp .env.example .env`, fill in the secrets, `docker compose up --build`.
# Production runs the same two images on Coolify (docs/deploy.md).
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: reconsumet
      POSTGRES_DB: reconsumet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconsumet -d reconsumet"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: api }
    env_file: [{ path: .env, required: false }]
    environment:
      PORT: 8080
      DATABASE_URL: postgres://reconsumet:${POSTGRES_PASSWORD}@postgres:5432/reconsumet
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "${API_PORT:-8080}:8080"

  relay:
    build: { context: ., target: relay }
    env_file: [{ path: .env, required: false }]
    environment:
      PORT: 8081
    ports:
      - "${RELAY_PORT:-8081}:8081"

volumes:
  pgdata:
